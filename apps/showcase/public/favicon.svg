<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <defs>
    <!-- Dark Mode Gradient -->
    <linearGradient id="fav-mobius-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="45%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Light Mode Gradient -->
    <linearGradient id="fav-mobius-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="45%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
  </defs>

  <style>
    .ribbon-back { stroke: #0284c7; opacity: 0.55; }
    .ribbon-front { stroke: url(#fav-mobius-light); }

    @media (prefers-color-scheme: dark) {
      .ribbon-back { stroke: #0284c7; opacity: 0.7; }
      .ribbon-front { stroke: url(#fav-mobius-dark); }
    }
  </style>

  <path
    d="M25 11 C28 15 27 21 22 24 C17 27 11 24 10 19 C9 14 3 12 3 16"
    stroke-width="3.8"
    stroke-linecap="round"
    class="ribbon-back"
  />
  <path
    d="M7 21 C4 17 5 11 10 8 C15 5 21 8 22 13 C23 18 29 20 29 16"
    stroke-width="3.8"
    stroke-linecap="round"
    class="ribbon-front"
  />
</svg>
