<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <defs>
    <!-- Dark Mode Gradient -->
    <linearGradient id="logo-mobius-dark" x1="15%" y1="15%" x2="85%" y2="85%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="45%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Light Mode Gradient -->
    <linearGradient id="logo-mobius-light" x1="15%" y1="15%" x2="85%" y2="85%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="45%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0284c7" flood-opacity="0.35" />
    </filter>
  </defs>

  <style>
    .ribbon-back { stroke: #0284c7; opacity: 0.55; }
    .ribbon-front { stroke: url(#logo-mobius-light); }

    @media (prefers-color-scheme: dark) {
      .ribbon-back { stroke: #0284c7; opacity: 0.7; }
      .ribbon-front { stroke: url(#logo-mobius-dark); }
    }
  </style>

  <g filter="url(#glow)">
    <path
      d="M100 44 C112 60 108 84 88 96 C68 108 44 96 40 76 C36 56 12 48 12 64"
      stroke-width="15"
      stroke-linecap="round"
      class="ribbon-back"
    />
    <path
      d="M28 84 C16 68 20 44 40 32 C60 20 84 32 88 52 C92 72 116 80 116 64"
      stroke-width="15"
      stroke-linecap="round"
      class="ribbon-front"
    />
  </g>
</svg>
